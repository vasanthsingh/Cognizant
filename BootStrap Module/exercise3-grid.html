<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 3 — Responsive Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Exercise 3 — Responsive Grid Layout</h1>
  <p class="mb-3">Three columns: stack on mobile, 2-per-row on tablets, 3-per-row on desktop.</p>
  <div class="row">
    <div class="col-12 col-md-6 col-lg-4 mb-3"><div class="p-3 border">Column 1</div></div>
    <div class="col-12 col-md-6 col-lg-4 mb-3"><div class="p-3 border">Column 2</div></div>
    <div class="col-12 col-md-6 col-lg-4 mb-3"><div class="p-3 border">Column 3</div></div>
  </div>
  <hr>
  <h2>Exercise 3.2 — container, row, col-* usage</h2>
  <div class="container bg-light p-3">This is a `.container` with a `.row` inside</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
