<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 8 — Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Exercise 8.1 — Registration Form</h1>
  <form>
    <div class="mb-3">
      <label class="form-label">Full name</label>
      <input class="form-control" type="text" placeholder="Jane Doe">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <div class="input-group">
        <span class="input-group-text">@</span>
        <input class="form-control" type="email" placeholder="email@example.com">
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="agree">
      <label class="form-check-label" for="agree">I agree</label>
    </div>
    <button class="btn btn-primary">Register</button>
  </form>
  <hr>
  <h2>Exercise 8.2 — Login (form-floating)</h2>
  <form style="max-width:360px;">
    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com">
      <label for="floatingEmail">Email address</label>
    </div>
    <div class="form-floating mb-3">
      <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
      <label for="floatingPassword">Password</label>
    </div>
    <button class="btn btn-success">Login</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
