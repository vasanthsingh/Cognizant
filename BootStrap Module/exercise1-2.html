<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap 5 Exercise 1.2 - Local Files</title>
  <link href="local/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
  <div class="container">
    <a class="navbar-brand" href="#">Bootstrap Local Demo</a>
  </div>
</nav>
<div class="container py-5">
  <h1 class="mb-4">Exercise 1.2 — Bootstrap from downloaded files</h1>
  <button class="btn btn-primary" id="localBtn">Local Bootstrap Button</button>
  <div class="mt-3" id="localOutput"></div>
</div>
<script src="local/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('localBtn').addEventListener('click', function(){
  document.getElementById('localOutput').textContent = 'Bootstrap (local) button clicked!';
});
</script>
</body>
</html>
