<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 7 — Typography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1 class="display-1">Display 1</h1>
  <p class="lead">This is a lead paragraph demonstrating <strong>lead</strong> class.</p>
  <p class="text-muted">This text is muted.</p>
  <p class="fw-bold">This text is bold using `fw-bold`.</p>
  <hr>
  <p class="text-uppercase">Uppercase text</p>
  <p class="text-lowercase">LOWERCASE text transformed to lowercase</p>
  <p class="text-capitalize">this sentence is capitalized</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
