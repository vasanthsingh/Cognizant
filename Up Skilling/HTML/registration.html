<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #e5e7eb;
            padding: 24px;
        }

        h1 {
            text-align: center;
            color: blueviolet;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        textarea {
      resize: vertical;
      min-height: 100px;
    }
    button{
        width: 100%;
        margin-top: 18px;
        padding: 10px;
        background-color: #1f3c88;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }
        button:hover {
      background: #16306a;
    }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>Event Registration</h1>
        <form id="registrationForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />

            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />

            <label for="eventType">Event Type</label>
            <select id="eventType" name="eventType" required>
                <option value="">Select an event</option>
                <option value="cleanup">Community Cleanup</option>
                <option value="donation">Donation Drive</option>
                <option value="workshop">Workshop</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here" required></textarea>

            <button type="submit">Register</button>
        </form>
        <output id="confirmationMessage"></output>
    </div>
<script>
    const form = document.getElementById("registrationForm");
    const output = document.getElementById("confirmationMessage");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      output.textContent = "Registration submitted successfully!";
    });
  </script>
</body>

</html>
