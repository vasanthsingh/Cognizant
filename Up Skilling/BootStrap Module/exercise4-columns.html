<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 4 — Column Layouts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Exercise 4.1 — Sidebar + Content</h1>
  <div class="row">
    <aside class="col-12 col-md-3 bg-secondary text-white p-3">Sidebar (col-md-3)</aside>
    <main class="col-12 col-md-9 p-3">Main content area (col-md-9)</main>
  </div>
  <hr>
  <h2>Exercise 4.2 — Four equal columns</h2>
  <div class="row text-center">
    <div class="col-6 col-sm-3 p-2"><div class="border p-2">1</div></div>
    <div class="col-6 col-sm-3 p-2"><div class="border p-2">2</div></div>
    <div class="col-6 col-sm-3 p-2"><div class="border p-2">3</div></div>
    <div class="col-6 col-sm-3 p-2"><div class="border p-2">4</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
