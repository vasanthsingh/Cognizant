<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5 — Alignment & Reordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Exercise 5.1 — Centering with flex utilities</h1>
  <div class="row justify-content-center align-items-center" style="height:120px; border:1px dashed #ccc;">
    <div class="col-auto">Centered content</div>
  </div>
  <hr>
  <h2>Exercise 5.2 — Reordering columns</h2>
  <div class="row">
    <div class="col-12 col-md-6 order-md-2 p-2"><div class="border p-2">Column A (order-md-2)</div></div>
    <div class="col-12 col-md-6 order-md-1 p-2"><div class="border p-2">Column B (order-md-1)</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
