<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap 5 Exercise 1.1 - CDN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Bootstrap CDN Demo</a>
  </div>
</nav>
<div class="container py-5">
  <h1 class="mb-4">Exercise 1.1 — Bootstrap via CDN</h1>
  <button class="btn btn-success" id="demoBtn">Click me</button>
  <div class="mt-3" id="output"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('demoBtn').addEventListener('click', function(){
  document.getElementById('output').textContent = 'Bootstrap (CDN) button clicked!';
});
</script>
</body>
</html>
