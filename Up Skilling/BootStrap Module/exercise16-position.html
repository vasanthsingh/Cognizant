<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 16 — Positioning Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="padding-bottom:80px;">
<div class="container py-4">
  <h1>Fixed footer</h1>
  <p>Scroll or resize to see footer fixed to bottom.</p>
  <div class="position-relative" style="max-width:300px;">
    <img src="https://via.placeholder.com/300x180" class="img-fluid" alt="">
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">New</span>
  </div>
</div>
<footer class="position-fixed bottom-0 start-0 w-100 bg-dark text-white p-2 text-center">Fixed footer</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
