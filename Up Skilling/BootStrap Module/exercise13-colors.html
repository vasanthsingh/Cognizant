<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 13 — Colors & Backgrounds</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Dashboard colors</h1>
  <div class="row">
    <div class="col-3 p-3 bg-primary text-white">Primary</div>
    <div class="col-3 p-3 bg-warning">Warning</div>
    <div class="col-3 p-3 bg-success text-white">Success</div>
    <div class="col-3 p-3 bg-danger text-white">Danger</div>
  </div>
  <hr>
  <div class="p-4 bg-gradient bg-dark text-white mt-3">Gradient dark background with white text</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
