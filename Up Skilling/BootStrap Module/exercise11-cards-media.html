<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 11 — Cards & Media</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Profile Card</h1>
  <div class="card" style="width:18rem;">
    <img src="https://via.placeholder.com/286x180" class="card-img-top" alt="...">
    <div class="card-body">
      <h5 class="card-title">Jane Doe</h5>
      <p class="card-text">Short bio goes here.</p>
    </div>
  </div>
  <hr>
  <h2>Media-like layout</h2>
  <div class="d-flex align-items-start">
    <img src="https://via.placeholder.com/64" class="me-3 rounded" alt="...">
    <div>
      <h5>Media title</h5>
      <p>Content aligned to right of the image.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
