<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 17 — Bootstrap Icons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1>Social icons in footer</h1>
  <footer class="d-flex gap-3">
    <a href="#"><i class="bi bi-twitter fs-3"></i></a>
    <a href="#"><i class="bi bi-facebook fs-3"></i></a>
    <a href="#"><i class="bi bi-instagram fs-3"></i></a>
  </footer>
  <hr>
  <h2>Icon-only buttons</h2>
  <button class="btn btn-outline-secondary"><i class="bi bi-bookmark"></i></button>
  <button class="btn btn-outline-primary"><i class="bi bi-heart"></i></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
